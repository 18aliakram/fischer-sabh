<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem Shield -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Outline with Glow -->
    <path d="M50 0 L92 24 L92 72 L50 96 L8 72 L8 24 Z" fill="url(#shieldGrad)" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Inner Accent Carbon Facets -->
    <path d="M50 8 L84 28 L84 68 L50 88 L16 68 L16 28 Z" fill="#090D16" fill-opacity="0.85"/>

    <!-- Dynamic Aerodynamic Speed Silhouette -->
    <path d="M22 56 C34 40, 62 36, 78 48 C68 45, 42 47, 30 64 Z" fill="url(#cyanGrad)" opacity="0.9"/>
    
    <!-- Stylized Precision F Monogram & Polishing Swirl -->
    <path d="M34 26 L66 26 C68 26, 70 28, 69 31 L67 36 C66.5 37.5, 65 38.5, 63.5 38.5 L46 38.5 L43.5 48.5 L58 48.5 C59.5 48.5, 61 49.5, 60.5 51.5 L59 56 C58.5 57.5, 57 58.5, 55.5 58.5 L41 58.5 L33 76 C32.5 77.5, 31 78.5, 29 78.5 L23 78.5 C21 78.5, 20 77, 20.5 75 Z" fill="url(#blueGrad)"/>

    <!-- Polishing Sparkle Star -->
    <g transform="translate(68, 22) scale(0.9)" filter="url(#glow)">
      <path d="M12 0 L14 8 L22 10 L14 12 L12 20 L10 12 L2 10 L10 8 Z" fill="#FFFFFF"/>
      <circle cx="12" cy="10" r="2.5" fill="#38BDF8"/>
    </g>

    <!-- Hydrophobic Droplet / Precision Ring Accent -->
    <circle cx="70" cy="70" r="5" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>
    <circle cx="70" cy="70" r="2" fill="#38BDF8"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main FISCHER Title -->
  <text x="126" y="62" font-family="system-ui, -apple-system, Sora, sans-serif" font-size="44" font-weight="900" letter-spacing="4.5" fill="#FFFFFF">
    FISCHER
  </text>

  <!-- Speed Dash Accent -->
  <rect x="420" y="32" width="6" height="32" rx="3" fill="url(#cyanGrad)" transform="skewX(-20)"/>
  <rect x="432" y="38" width="5" height="26" rx="2.5" fill="#38BDF8" opacity="0.6" transform="skewX(-20)"/>

  <!-- Subtitle: MOBILE DETAILING -->
  <text x="128" y="88" font-family="ui-monospace, monospace, Space Mono, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#38BDF8">
    MOBILE DETAILING
  </text>

  <!-- Quality Location Badge -->
  <text x="325" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
    PORTAGE · KALAMAZOO
  </text>
  <circle cx="316" cy="85" r="2" fill="#38BDF8"/>
</svg>