          var currentFetch = originalFetch ? originalFetch.bind(window) : undefined;

            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // If defineProperty fails, do not block page execution
        }
      })();
    </script>
